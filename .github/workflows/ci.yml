name: Update ASN and IP List

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: |
          python tests/test_collapse.py
          python tests/test_http_client.py

      - name: Fetch ASN
        run: python scripts/ChinaASN.py

      - name: Fetch IP and convert formats
        run: python scripts/convert_formats.py

      - name: Validate outputs
        run: python scripts/validate_outputs.py

      - name: Commit generated outputs
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore: update IP/ASN lists [automated]"
          file_pattern: "ASN.China.list IP.China.txt IP.China.yaml IP.China.ipv4.yaml IP.China.ipv6.yaml"
